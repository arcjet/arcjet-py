name: Release Please

# Keeps a release pull request open against `main` and, when one is merged,
# creates the `vX.Y.Z` tag and GitHub release. See CONTRIBUTING.md#releasing.
#
# Publishing is NOT done here and is never started automatically: a person
# dispatches `release.yml` on the tag. The default `GITHUB_TOKEN` is used on
# purpose, since a tag it creates does not trigger other workflows.

on:
  push:
    branches:
      - main

permissions: {}

# Queue rather than cancel, so a run that is creating a release always
# finishes before the next one reads the repository state.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Push the release branch, create the tag and GitHub release.
      contents: write
      # Open, label, and update the release pull request.
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo-and-containers: true
          # Release Please only calls the GitHub REST and GraphQL APIs.
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      - name: Release Please
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
