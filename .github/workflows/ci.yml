name: Test

on:
  pull_request:
    types:
      - labeled
      - opened
      - reopened
      - synchronize
      - unlabeled
  merge_group: 
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Fetch base branch for griffe comparison
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch origin "$BASE_REF"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Ruff lint
        run: uv run ruff check . --output-format github
      - name: Ruff format
        run: uv run ruff format --diff .
      - name: Ty type check
        run: uv run ty check --output-format github
      - name: Pyright type check
        run: uv run pyright
      - name: Griffe check
        # Only run on PRs and allow breaking changes to be merged with a label
        if: github.event_name == 'pull_request'
        continue-on-error: ${{ contains(github.event.pull_request.labels.*.name, 'breaking') }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: uv run griffe check arcjet --search src --extensions tools/griffe_extensions.py:IgnoreProtobufDescriptors --format github --against "origin/${BASE_REF}"


  test:
    name: Run tests
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Tests
        run: uv run pytest
