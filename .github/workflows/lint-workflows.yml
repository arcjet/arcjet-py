name: Lint workflows

on:
  pull_request:
    # Recommended by Graphite: https://graphite.dev/docs/github-configuration-guidelines#github-actions
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/**
  merge_group:
  push:
    branches:
      - main
    paths:
      - .github/workflows/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: actionlint + zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Docker container actions cannot start in this repository: a workflow
      # that references one fails before any job runs, emitting no check run.
      # actionlint therefore comes from mise, which resolves it to the aqua
      # backend and verifies the download against the published checksums.
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          cache: false
          mise_toml: |
            [tools]
            actionlint = "1.7.12"

      - name: actionlint
        run: actionlint -color

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      # Gates on medium-and-above findings (all confidence levels).
      # Drop --min-severity entirely once low-severity findings are triaged.
      - name: zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uvx zizmor==1.30.1 --min-severity=medium .github/workflows/
