[project]
name = "example-fastapi-strands-agents-guard"
version = "0.1.0"
description = "Arcjet Python SDK Example FastAPI + Strands Agents Guard Application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "arcjet[strands-agents]",
    "fastapi[standard]==0.141.1",
    "strands-agents[anthropic]>=1.11.0,<2",
]

[tool.uv]
exclude-newer = "7 days"

# Use the local SDK so this example exercises the current Strands Agents
# adapter. The Anthropic extra lets the example run without Bedrock.
[tool.uv.sources]
arcjet = { path = "../../", editable = true }
