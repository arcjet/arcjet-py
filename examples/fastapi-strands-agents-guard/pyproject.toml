[project]
name = "example-fastapi-strands-agents-guard"
version = "0.1.0"
description = "Arcjet Python SDK Example FastAPI + Strands Agents Guard Application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "arcjet[strands-agents,sensitive-info-rampart]",
    "fastapi[standard]==0.157.0",
    "strands-agents[anthropic]>=1.11.0,<2",
]

[tool.uv]
# filelock 4.2.1+ fixes GHSA-v4x8-3wr5-3wq8 (and two low ones) but needs
# Python 3.11. Keep Python 3.10 on 3.20.3, which predates the affected range.
constraint-dependencies = ["filelock<3.20.4; python_full_version < '3.11'"]
exclude-newer = "7 days"

# Use the local SDK so this example exercises the current Strands Agents
# adapter. The Anthropic extra lets the example run without Bedrock.
[tool.uv.sources]
arcjet = { path = "../../", editable = true }
arcjet-sensitive-info-rampart = { path = "../../sensitive-info-rampart", editable = true }
