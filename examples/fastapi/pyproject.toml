[project]
name = "example-fastapi"
version = "0.1.0"
description = "Arcjet Python SDK Example FastAPI Application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["arcjet[sensitive-info-rampart]", "fastapi[standard]==0.162.2"]

[tool.uv]
exclude-newer = "7 days"

[tool.uv.sources]
arcjet = { path = "../../", editable = true }
arcjet-sensitive-info-rampart = { path = "../../sensitive-info-rampart", editable = true }
