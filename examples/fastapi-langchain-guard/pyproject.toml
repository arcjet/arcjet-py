[project]
name = "example-fastapi-langchain-guard"
version = "0.1.0"
description = "Arcjet Python SDK Example FastAPI + LangChain Guard Application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "arcjet[langchain-agents]",
    "fastapi[standard]==0.141.1",
    "langchain==1.3.14",
    "langchain-openai==1.4.1",
]

[tool.uv]
exclude-newer = "7 days"

[tool.uv.sources]
arcjet = { path = "../../", editable = true }
