[project]
name = "example-fastapi-langchain-guard"
version = "0.1.0"
description = "Arcjet Python SDK Example FastAPI + LangChain Guard Application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "arcjet[langchain-agents,sensitive-info-rampart]",
    "fastapi[standard]==0.157.0",
    "langchain==1.4.6",
    "langchain-openai==1.7.2",
]

[tool.uv]
exclude-newer = "7 days"

[tool.uv.sources]
arcjet = { path = "../../", editable = true }
arcjet-sensitive-info-rampart = { path = "../../sensitive-info-rampart", editable = true }
