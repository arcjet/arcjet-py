[project]
name = "example-fastapi-langchain"
version = "0.1.0"
description = "Arcjet Python SDK Example FastAPI + LangChain Application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arcjet[sensitive-info-rampart]",
    "fastapi[standard]==0.162.2",
    "langchain==1.4.9",
    "langchain-openai==1.7.4",
]

[tool.uv]
exclude-newer = "7 days"

[tool.uv.sources]
arcjet = { path = "../../", editable = true }
arcjet-sensitive-info-rampart = { path = "../../sensitive-info-rampart", editable = true }
