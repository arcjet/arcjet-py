[project]
name = "example-flask-langchain"
version = "0.1.0"
description = "Arcjet Python SDK Example Flask + LangChain Application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "arcjet",
    "flask==3.1.3",
    "langchain==1.3.15",
    "langchain-openai==1.5.1",
]

[tool.uv]
exclude-newer = "7 days"

[tool.uv.sources]
arcjet = { path = "../../", editable = true }
