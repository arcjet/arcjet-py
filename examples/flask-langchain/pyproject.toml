[project]
name = "example-flask-langchain"
version = "0.1.0"
description = "Arcjet Python SDK Example Flask + LangChain Application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "arcjet[sensitive-info-rampart]",
    "flask==3.1.3",
    "langchain==1.4.6",
    "langchain-openai==1.7.2",
]

[tool.uv]
# filelock 4.2.1+ fixes GHSA-v4x8-3wr5-3wq8 (and two low ones) but needs
# Python 3.11. Keep Python 3.10 on 3.20.3, which predates the affected range.
constraint-dependencies = ["filelock<3.20.4; python_full_version < '3.11'"]
exclude-newer = "7 days"

[tool.uv.sources]
arcjet = { path = "../../", editable = true }
arcjet-sensitive-info-rampart = { path = "../../sensitive-info-rampart", editable = true }
