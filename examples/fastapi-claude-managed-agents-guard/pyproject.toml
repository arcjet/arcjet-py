[project]
name = "example-fastapi-claude-managed-agents-guard"
version = "0.1.0"
description = "Arcjet Python SDK Example FastAPI + Claude Managed Agents Guard Application"
readme = "README.md"
requires-python = ">=3.10"
# The Claude Managed Agents adapter ships in the PyPI release of arcjet 1.3.0.
# The extra pulls `anthropic>=0.92.0,<2`. No chromadb.
dependencies = [
    "arcjet[claude-managed-agents]==1.3.0",
    "fastapi[standard]==0.141.1",
]

[tool.uv]
exclude-newer = "7 days"
# arcjet 1.3.0 was uploaded on 2026-10-01, inside the 7-day window above.
# Exempt only arcjet, with a fixed cutoff just after that upload.
exclude-newer-package = { arcjet = "2026-10-02T00:00:00Z" }
