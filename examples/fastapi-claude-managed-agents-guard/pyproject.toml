[project]
name = "example-fastapi-claude-managed-agents-guard"
version = "0.1.0"
description = "Arcjet Python SDK Example FastAPI + Claude Managed Agents Guard Application"
readme = "README.md"
requires-python = ">=3.10"
# The Claude Managed Agents adapter ships in the PyPI release of arcjet 1.4.0.
# The extra pulls `anthropic>=0.92.0,<2`. No chromadb. `sensitive-info-rampart`
# pulls the on-device Rampart sensitive info backend.
dependencies = [
    "arcjet[claude-managed-agents,sensitive-info-rampart]==1.4.0",
    "fastapi[standard]==0.157.0",
]

[tool.uv]
# filelock 4.2.1+ fixes GHSA-v4x8-3wr5-3wq8 (and two low ones) but needs
# Python 3.11. Keep Python 3.10 on 3.20.3, which predates the affected range.
constraint-dependencies = ["filelock<3.20.4; python_full_version < '3.11'"]
exclude-newer = "7 days"
# arcjet and its Rampart backend are our own packages, so they are exempt from
# the cooldown above: a new release is usable here as soon as it is published.
exclude-newer-package = { arcjet = false, arcjet-sensitive-info-rampart = false }
