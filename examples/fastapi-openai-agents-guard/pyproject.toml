[project]
name = "example-fastapi-openai-agents-guard"
version = "0.1.0"
description = "Arcjet Python SDK Example FastAPI + OpenAI Agents Guard Application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "arcjet[openai-agents,sensitive-info-rampart]",
    "fastapi[standard]==0.157.0",
]

[tool.uv]
# filelock 4.2.1+ fixes GHSA-v4x8-3wr5-3wq8 (and two low ones) but needs
# Python 3.11. Keep Python 3.10 on 3.20.3, which predates the affected range.
constraint-dependencies = ["filelock<3.20.4; python_full_version < '3.11'"]
exclude-newer = "7 days"

# OpenAI Agents adapter shipped on main in arcjet-py#226. Use the local
# checkout so this example tracks the merged SDK. The extra pulls
# `openai-agents>=0.19.0,<1`. No chromadb.
[tool.uv.sources]
arcjet = { path = "../../", editable = true }
arcjet-sensitive-info-rampart = { path = "../../sensitive-info-rampart", editable = true }
