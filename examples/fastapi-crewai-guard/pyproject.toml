[project]
name = "example-fastapi-crewai-guard"
version = "0.1.0"
description = "Arcjet Python SDK Example FastAPI + CrewAI Guard Application"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "arcjet",
    "crewai>=1.15.3,<2",
    "fastapi[standard]==0.141.1",
]

[tool.uv]
exclude-newer = "7 days"

# CrewAI adapter shipped on main in #224; not a PyPI release yet. Pin the
# core package (there is no `arcjet[crewai]` extra — chromadb CVE) to the
# #224 merge commit. Install `crewai` as a direct example dependency.
[tool.uv.sources]
arcjet = { git = "https://github.com/arcjet/arcjet-py", rev = "b1253640ce676b948594beed5fe62450d0e1c77d" }
