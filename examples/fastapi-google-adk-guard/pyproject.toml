[project]
name = "example-fastapi-google-adk-guard"
version = "0.1.0"
description = "Arcjet Python SDK Example FastAPI + Google ADK Guard Application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "arcjet[google-adk,sensitive-info-rampart]",
    "fastapi[standard]==0.141.1",
    "google-adk>=2.0.0,<3",
]

[tool.uv]
exclude-newer = "7 days"

# Use the local SDK so this example exercises the current Google ADK adapter.
[tool.uv.sources]
arcjet = { path = "../../", editable = true }
arcjet-sensitive-info-rampart = { path = "../../sensitive-info-rampart", editable = true }
