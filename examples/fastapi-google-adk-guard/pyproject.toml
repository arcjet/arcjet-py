[project]
name = "example-fastapi-google-adk-guard"
version = "0.1.0"
description = "Arcjet Python SDK Example FastAPI + Google ADK Guard Application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "arcjet[google-adk]",
    "fastapi[standard]==0.141.1",
]

[tool.uv]
exclude-newer = "7 days"

# Google ADK adapter is unpublished. Pin `arcjet[google-adk]` to SHA
# 1e6e71cc70c8c98c1364fb0f88c7b09675715ec5 (branch
# `david/cursor/google-adk-guard-c36e`). That is not a PyPI release. The extra
# pulls `google-adk>=2.0.0,<3`. No chromadb.
#
# TODO: once the adapter lands on main (or PyPI), drop this git pin and
# use the local checkout like examples/fastapi-openai-agents-guard.
[tool.uv.sources]
arcjet = { git = "https://github.com/arcjet/arcjet-py", rev = "1e6e71cc70c8c98c1364fb0f88c7b09675715ec5" }
