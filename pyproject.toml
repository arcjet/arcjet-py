[project]
name = "arcjet"
version = "0.10.0b1"
description = "Arcjet Python SDK. Runtime security for AI applications. Prompt injection detection, bot protection, rate limiting, sensitive data detection, and WAF for Python apps."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Arcjet", email = "support@arcjet.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "connect-python>=0.8.1",
  "pyqwest>=0.8.0,<0.9.0",
  "wasmtime>=47.0.1,<47.1.0",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Framework :: Flask",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Topic :: Communications :: Email :: Filters",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Networking :: Firewalls",
]
keywords = [
  "ai-security",
  "api-security",
  "bot-detection",
  "bot-protection",
  "email-validation",
  "fastapi",
  "flask",
  "llm-security",
  "prompt-injection",
  "rate-limiting",
  "security",
  "sensitive-data",
  "waf",
]

[project.optional-dependencies]
# On-device Rampart NER model backend for sensitive info detection. The heavy
# runtime deps and the bundled model ship in the separate
# `arcjet-sensitive-info-rampart` distribution, so they are only installed when
# this extra is requested.
# Pinned to the exact matching version: the backend imports private core
# modules, so the two are released in lockstep and must never resolve to
# different versions (see the reciprocal pin in that package). Bump both
# together every release.
sensitive-info-rampart = ["arcjet-sensitive-info-rampart==0.10.0b1"]
langchain = ["langchain-core>=1.2.5,<2"]
# Agent middleware only. Separate from `langchain` because the full
# `langchain` package hard-depends on LangGraph, and folding it into the
# extra above would push LangGraph onto every `guard_tool` user.
langchain-agents = ["langchain>=1,<2"]

[project.urls]
"homepage" = "https://arcjet.com"
"source" = "https://github.com/arcjet/arcjet-py"
"documentation" = "https://docs.arcjet.com"
"releases" = "https://github.com/arcjet/arcjet-py/releases"

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["sensitive-info-rampart"]

[tool.uv.sources]
arcjet-sensitive-info-rampart = { workspace = true }

[dependency-groups]
dev = [
  # Exercise the Rampart backend (and its runtime deps) in the test suite.
  "arcjet-sensitive-info-rampart",
  "pytest-benchmark>=5.1.0",
  "fastapi==0.141.1",                      # For testing integration with FastAPI
  "flask==3.1.3",                          # For testing integration with Flask
  "griffe==2.1.0",
  "httpx==0.28.1",                         # Used by FastAPI tests
  "langchain>=1,<2",                       # For testing agent middleware
  "langchain-core>=1.2.5,<2",              # For testing integration with LangChain
  "pyright==1.1.411",
  "hypothesis>=6.100.0",
  # Held <9.1 while bytecodealliance/wasmtime-py#254 remains unresolved; see
  # tests/analyze/test_detect_bot.py::TestDetectBotThreadSafety and arcjet-py#185.
  "pytest==9.0.3",
  "pytest-cov>=7.0.0",
  "ruff==0.15.22",
  "tomli>=2.0.0; python_version < '3.11'",
  "ty==0.0.23",
  "types-protobuf==7.34.1.20260518",
]

[tool.pytest.ini_options]
addopts = [
  "-q",
  "--cov=src/arcjet",
  "--cov-report=term-missing",
  "--benchmark-disable",
]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
omit = [
  # Generated protobuf code
  "src/arcjet/proto/*",
  "src/arcjet/guard/proto/*",
  # Generated by witgen (uv run python -m tools.witgen)
  "src/arcjet/_analyze/__init__.py",
  "src/arcjet/_analyze/_types.py",
  "src/arcjet/_analyze/_convert.py",
  "src/arcjet/_analyze/_component.py",
  "src/arcjet/_analyze/_imports.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
exclude = [
  # Generated code
  "src/arcjet/proto",
  "src/arcjet/guard/proto",
  "src/arcjet/_analyze",
  # TODO: re-enable once we fix the issues
  "examples",
]

[tool.ruff.lint]
select = [
  "F401", # Unused imports
  "I",    # Import formatting
]

[tool.pyright]
exclude = [
  # Generated protobuf code
  "src/arcjet/guard/proto",
  "tests/mocked/conftest.py",
  "tests/mocked/test_cache.py",
  "tests/mocked/test_client_sync.py",
  "tests/mocked/test_context.py",
  "tests/mocked/test_decision.py",
  "tests/mocked/test_enums.py",
  "tests/mocked/test_logging.py",
  "tests/mocked/test_rules.py",
]
include = ["src", "tests"]
pythonVersion = "3.10"

[tool.uv]
exclude-newer = "7 days"

[tool.ty.src]
exclude = [
  # Generated protobuf code
  "src/arcjet/guard/proto",
  # TODO: re-enable once we fix the issues
  "examples",
  "tests/mocked/conftest.py",
  "tests/mocked/test_cache.py",
  "tests/mocked/test_client_sync.py",
  "tests/mocked/test_context.py",
  "tests/mocked/test_decision.py",
  "tests/mocked/test_enums.py",
  "tests/mocked/test_logging.py",
  "tests/mocked/test_rules.py",
]
