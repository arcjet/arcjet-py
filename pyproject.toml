[project]
name = "arcjet"
version = "1.0.0"
description = "Arcjet Python SDK. Runtime security for AI applications. Prompt injection detection, bot protection, rate limiting, sensitive data detection, and WAF for Python apps."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Arcjet", email = "support@arcjet.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "connect-python>=0.8.1",
  "pyqwest>=0.9.0,<0.10.0",
  "wasmtime>=47.0.1,<47.1.0",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Framework :: Flask",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Topic :: Communications :: Email :: Filters",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Networking :: Firewalls",
]
keywords = [
  "ai-security",
  "api-security",
  "bot-detection",
  "bot-protection",
  "email-validation",
  "fastapi",
  "flask",
  "llm-security",
  "prompt-injection",
  "rate-limiting",
  "security",
  "sensitive-data",
  "waf",
]

[project.optional-dependencies]
# On-device Rampart NER model backend for sensitive info detection. The heavy
# runtime deps and the bundled model ship in the separate
# `arcjet-sensitive-info-rampart` distribution, so they are only installed when
# this extra is requested.
# Pinned to the exact matching version: the backend imports private core
# modules, so the two are released in lockstep and must never resolve to
# different versions (see the reciprocal pin in that package). Bump both
# together every release.
sensitive-info-rampart = ["arcjet-sensitive-info-rampart==1.0.0"]
langchain = ["langchain-core>=1.2.5,<2"]
# Agent middleware only. Separate from `langchain` because the full
# `langchain` package hard-depends on LangGraph, and folding it into the
# extra above would push LangGraph onto every `guard_tool` user.
#
# `langgraph` is named even though `langchain` depends on it, because
# `_middleware.py` imports `langgraph.prebuilt.tool_node` and `langgraph.types`
# directly. The floors are the versions the middleware actually imports at:
# below langgraph 1.2 `tool_node` fails on `langgraph.runtime.ExecutionInfo`,
# and langchain below 1.3 resolves to one of those. The core floor matches the
# `langchain` extra, because the middleware guards through the same checkpoint.
langchain-agents = [
  "langchain>=1.3,<2",
  "langchain-core>=1.2.5,<2",
  "langgraph>=1.2,<2",
]
# Authored FunctionTool wrap. Separate extra so installing `arcjet` never
# pulls the OpenAI Agents SDK; `arcjet.guard.openai_agents` imports `agents`
# lazily. The floor is the first release whose FunctionTool.tool_input_guardrails
# + ToolGuardrailFunctionOutput.reject_content skip invoke before
# on_invoke_tool. Verified on 0.22.0. No chromadb — unlike CrewAI this extra
# is safe to declare.
openai-agents = ["openai-agents>=0.19.0,<1"]
# Authored @tool / SdkMcpTool wrap plus PreToolUse / UserPromptSubmit hooks.
# Separate extra so installing `arcjet` never pulls the Claude Agent SDK;
# `arcjet.guard.claude_agent_sdk` imports `claude_agent_sdk` lazily. The
# floor is 0.2.127 (0.2.83 was the mcp CVE + timeout fail-close line;
# 0.2.127 includes that and the background-task PreToolUse stdin fix, so
# this adapter does not have to caveat that path). Verified on 0.2.148.
# No chromadb — unlike CrewAI this extra is safe to declare. Like
# openai-agents it is in no dependency group so the lockfile does not
# pull its transitive tree into every `uv sync`.
claude-agent-sdk = ["claude-agent-sdk>=0.2.127,<1"]
# Hosted Claude Managed Agents (REST+SSE, beta managed-agents-2026-04-01).
# Separate extra so installing `arcjet` never pulls `anthropic`;
# `arcjet.guard.claude_managed_agents` imports `anthropic` lazily and
# duck-types `sessions.events.send`. This is NOT the Claude Agent SDK
# extra — do not reuse that module or `guard_tool` / PreToolUse.
# The floor is 0.92.0, the first release whose changelog adds
# `client.beta.agents` / `sessions` / `environments`. EnvironmentWorker
# landed later (0.103.0); the adapter duck-types `call` so the extra
# floor stays at agents/sessions/environments. No chromadb — unlike
# CrewAI this extra is safe to declare. Like openai-agents it is in no
# dependency group so the lockfile does not pull its transitive tree
# into every `uv sync`.
claude-managed-agents = ["anthropic>=0.92.0,<2"]
# Authored @tool wrap plus BeforeToolCallEvent.cancel_tool hooks. Separate
# extra so installing `arcjet` never pulls Strands Agents;
# `arcjet.guard.strands_agents` imports `strands` lazily. The floor is
# 1.11.0 — the first 1.x whose BeforeToolCallEvent has cancel_tool
# (1.10.0 does not; PR 964 shipped in 1.11.0). Verified on 1.54.0. The
# default extra set does not pull chromadb — unlike CrewAI this extra is
# safe to declare. Like openai-agents it is in no dependency group so
# the lockfile does not pull its transitive tree into every `uv sync`.
strands-agents = ["strands-agents>=1.11.0,<2"]
# Authored LlmAgent.before_tool_callback plus Runner BasePlugin.
# Separate extra so installing `arcjet` never pulls Google ADK;
# `arcjet.guard.google_adk` imports `google.adk` lazily. The floor is
# 2.0.0 — ADK 2.x, matching JS `@arcjet/guard/google-adk/v2`.
# Verified on 2.8.0. No chromadb — unlike CrewAI this extra is safe
# to declare. Like openai-agents it is in no dependency group so the
# lockfile does not pull its transitive tree into every `uv sync`.
google-adk = ["google-adk>=2.0.0,<3"]
# There is deliberately no `crewai` extra, and CrewAI is in no dependency
# group. `crewai` hard-depends on `chromadb~=1.1.0`, and every chromadb from
# 1.0.0 to 1.5.9 carries an unpatched critical RCE (CVE-2026-45829 /
# GHSA-f4j7-r4q5-qw2c: the Python FastAPI server loads a client-supplied
# HuggingFace embedding model before it authenticates the request). No fixed
# version exists, and crewai's `~=1.1.0` pin could not reach one if it did, so
# an extra would put an unpatchable critical CVE into every `arcjet[crewai]`
# install and into this lockfile.
#
# `arcjet.guard.crewai` imports CrewAI lazily and enforces its own floor
# (>=1.15.3) at registration, so applications install CrewAI themselves. See
# `src/arcjet/guard/crewai/_import.py` and CONTRIBUTING for running the tests.

[project.urls]
"homepage" = "https://arcjet.com"
"source" = "https://github.com/arcjet/arcjet-py"
"documentation" = "https://docs.arcjet.com"
"releases" = "https://github.com/arcjet/arcjet-py/releases"

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["sensitive-info-rampart"]

[tool.uv.sources]
arcjet-sensitive-info-rampart = { workspace = true }

[dependency-groups]
dev = [
  # Exercise the Rampart backend (and its runtime deps) in the test suite.
  "arcjet-sensitive-info-rampart",
  "pytest-benchmark>=5.1.0",
  "fastapi==0.141.1",                      # For testing integration with FastAPI
  "flask==3.1.3",                          # For testing integration with Flask
  "griffe==2.2.0",
  "httpx==0.28.1",                         # Used by FastAPI tests
  "langchain>=1,<2",                       # For testing agent middleware
  "langchain-core>=1.2.5,<2",              # For testing integration with LangChain
  "pyright==1.1.411",
  "hypothesis>=6.100.0",
  # 9.1 cut inter-test gc.collect() passes (pytest#14441); AnalyzeComponent
  # now serializes wasmtime slab ops so this is safe (arcjet-py#154).
  "pytest==9.1.1",
  "pytest-cov>=7.0.0",
  "ruff==0.16.3",
  "tomli>=2.0.0; python_version < '3.11'",
  "ty==0.0.23",
  "types-protobuf==7.34.1.20260816",
]

[tool.pytest.ini_options]
addopts = [
  "-q",
  "--cov=src/arcjet",
  "--cov-report=term-missing",
  "--benchmark-disable",
]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
omit = [
  # Generated protobuf code
  "src/arcjet/proto/*",
  "src/arcjet/guard/proto/*",
  # Generated by witgen (uv run python -m tools.witgen)
  "src/arcjet/_analyze/__init__.py",
  "src/arcjet/_analyze/_types.py",
  "src/arcjet/_analyze/_convert.py",
  "src/arcjet/_analyze/_component.py",
  "src/arcjet/_analyze/_imports.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
exclude = [
  # Generated code
  "src/arcjet/proto",
  "src/arcjet/guard/proto",
  "src/arcjet/_analyze",
  # TODO: re-enable once we fix the issues
  "examples",
]

[tool.ruff.lint]
select = [
  "F401", # Unused imports
  "I",    # Import formatting
]

[tool.pyright]
exclude = [
  # Generated protobuf code
  "src/arcjet/guard/proto",
  "tests/mocked/conftest.py",
  "tests/mocked/test_cache.py",
  "tests/mocked/test_client_sync.py",
  "tests/mocked/test_context.py",
  "tests/mocked/test_decision.py",
  "tests/mocked/test_enums.py",
  "tests/mocked/test_logging.py",
  "tests/mocked/test_rules.py",
  # Optional extra; crewai is not in the default install (Python <3.14).
  "tests/integration/guard/test_crewai.py",
  # Optional extra; openai-agents is not in the default install.
  "tests/integration/guard/test_openai_agents.py",
  "tests/integration/guard/test_openai_agents_runner.py",
  # Optional extra; claude-agent-sdk is not in the default install.
  "tests/integration/guard/test_claude_agent_sdk.py",
  # Optional extra; strands-agents is not in the default install.
  "tests/integration/guard/test_strands_agents.py",
  # Optional extra; google-adk is not in the default install.
  "tests/integration/guard/test_google_adk.py",
]
include = ["src", "tests"]
pythonVersion = "3.10"

[tool.uv]
exclude-newer = "7 days"

[tool.ty.src]
exclude = [
  # Generated protobuf code
  "src/arcjet/guard/proto",
  # TODO: re-enable once we fix the issues
  "examples",
  "tests/mocked/conftest.py",
  "tests/mocked/test_cache.py",
  "tests/mocked/test_client_sync.py",
  "tests/mocked/test_context.py",
  "tests/mocked/test_decision.py",
  "tests/mocked/test_enums.py",
  "tests/mocked/test_logging.py",
  "tests/mocked/test_rules.py",
  # Optional extra; crewai is not in the default install (Python <3.14).
  "tests/integration/guard/test_crewai.py",
  # Optional extra; openai-agents is not in the default install.
  "tests/integration/guard/test_openai_agents.py",
  "tests/integration/guard/test_openai_agents_runner.py",
  # Optional extra; claude-agent-sdk is not in the default install.
  "tests/integration/guard/test_claude_agent_sdk.py",
  # Optional extra; strands-agents is not in the default install.
  "tests/integration/guard/test_strands_agents.py",
  # Optional extra; google-adk is not in the default install.
  "tests/integration/guard/test_google_adk.py",
]
